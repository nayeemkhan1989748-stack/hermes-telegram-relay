name: Hermes Telegram relay

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests kaggle
      - name: Poll Telegram and submit task
        run: python relay.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_ALLOWED_USERS: '6729267449'
          KAGGLE_SLUG: 'nayeemkhan1231/hermes-agent-kaggle'
      - name: Save polling offset
        run: |
          git config user.name "hermes-relay"
          git config user.email "hermes-relay@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update relay offset"
            git push
          fi
